<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quote inbox · Illinois CPR Certification</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body class="admin-body">
    <main class="admin">
      <header class="admin-head">
        <h1>Quote inbox</h1>
        <button id="logout" type="button" hidden>Sign out</button>
      </header>

      <form id="login" class="login">
        <p>Sign in to see class quote requests.</p>
        <label>
          Username
          <input name="username" type="text" autocomplete="username" required />
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" hidden></p>
      </form>

      <section id="inbox" hidden>
        <p id="empty" hidden>No quote requests yet.</p>
        <div id="quotes"></div>
      </section>
    </main>
    <script src="/admin.js" defer></script>
  </body>
</html>
